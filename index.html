<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မြန်မာစာ AI Assistant - Multi City Weather & News</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Pyidaungsu', 'Myanmar3', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: #0084ff;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        .user-message {
            justify-content: flex-end;
        }
        .bot-message {
            justify-content: flex-start;
        }
        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            background: white;
            border: 1px solid #ddd;
            line-height: 1.4;
        }
        .user-message .bubble {
            background: #0084ff;
            color: white;
            border: none;
        }
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        #userInput {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 1em;
            font-family: 'Pyidaungsu', 'Myanmar3', Arial, sans-serif;
        }
        #sendBtn {
            background: #0084ff;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
        }
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .quick-btn {
            background: #0084ff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            cursor: pointer;
            font-family: 'Pyidaungsu', 'Myanmar3', Arial, sans-serif;
            transition: background 0.3s;
        }
        .quick-btn:hover {
            background: #0066cc;
        }
        .city-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }
        .city-btn {
            background: #00b894;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            cursor: pointer;
            font-family: 'Pyidaungsu', 'Myanmar3', Arial, sans-serif;
            transition: background 0.3s;
        }
        .city-btn:hover {
            background: #00a085;
        }
        .news-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }
        .news-btn {
            background: #e17055;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            cursor: pointer;
            font-family: 'Pyidaungsu', 'Myanmar3', Arial, sans-serif;
            transition: background 0.3s;
        }
        .news-btn:hover {
            background: #d63031;
        }
        .api-result {
            background: #e3f2fd;
            border-left: 4px solid #0084ff;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
        }
        .weather-result {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
        }
        .news-result {
            background: #ffeaa7;
            border-left: 4px solid #fdcb6e;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
        }
        .typing {
            display: inline-block;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        .news-item {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        .news-title {
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 5px;
        }
        .news-date {
            font-size: 0.8em;
            color: #636e72;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>🤖 မြန်မာစာ AI အကူ</h1>
            <p>ရာသီဥတု + သတင်း + တွက်ချက်မှု</p>
        </div>
        
        <div class="messages" id="messages">
            <div class="message bot-message">
                <div class="bubble">
                    <strong>မင်္ဂလာပါ! 👋</strong><br>
                    ကျွန်တော်က မြန်မာစာပါ AI အကူပါ။ ရာသီဥတု၊ သတင်း၊ ငွေလဲနှုန်းနဲ့ တွက်ချက်မှုတွေ ကူညီပေးနိုင်ပါတယ်။
                    
                    <div class="quick-buttons">
                        <button class="quick-btn" data-question="ရာသီဥတု">🌤️ ရာသီဥတု</button>
                        <button class="quick-btn" data-question="သတင်း">📰 သတင်းများ</button>
                        <button class="quick-btn" data-question="ငွေလဲနှုန်း">💱 ငွေလဲနှုန်း</button>
                        <button class="quick-btn" data-question="၁၅×၃ တွက်ပေးပါ">🧮 တွက်ချက်မှု</button>
                    </div>

                    <div style="margin-top: 10px;">
                        <strong>မြို့ရွေးရန်:</strong>
                        <div class="city-buttons">
                            <button class="city-btn" data-question="ရန်ကုန် ရာသီဥတု">ရန်ကုန်</button>
                            <button class="city-btn" data-question="မန္တလေး ရာသီဥတု">မန္တလေး</button>
                            <button class="city-btn" data-question="နေပြည်တော် ရာသီဥတု">နေပြည်တော်</button>
                            <button class="city-btn" data-question="ပဲခူး ရာသီဥတု">ပဲခူး</button>
                            <button class="city-btn" data-question="မော်လမြိုင် ရာသီဥတု">မော်လမြိုင်</button>
                        </div>
                    </div>

                    <div style="margin-top: 10px;">
                        <strong>သတင်းအမျိုးအစား:</strong>
                        <div class="news-buttons">
                            <button class="news-btn" data-question="နိုင်ငံတော်သတင်း">နိုင်ငံတော်</button>
                            <button class="news-btn" data-question="စီးပွားရေးသတင်း">စီးပွားရေး</button>
                            <button class="news-btn" data-question="ကျန်းမာရေးသတင်း">ကျန်းမာရေး</button>
                            <button class="news-btn" data-question="အားကစားသတင်း">အားကစား</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="စာရိုက်ထည့်ပါ (သို့) ခလုတ်နှိပ်ပါ..." autocomplete="off">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        // Myanmar Cities Mapping
        const myanmarCities = {
            'ရန်ကုန်': 'Yangon',
            'မန္တလေး': 'Mandalay', 
            'နေပြည်တော်': 'Naypyidaw',
            'ပဲခူး': 'Bago',
            'မော်လမြိုင်': 'Mawlamyine',
            'စစ်တွေ': 'Sittwe',
            'တောင်ကြီး': 'Taunggyi',
            'ပြင်ဦးလွင်': 'Pyin Oo Lwin',
            'မကွေး': 'Magway',
            'မြစ်ကြီးနား': 'Myitkyina'
        };

        // News Categories
        const newsCategories = {
            'နိုင်ငံတော်': 'politics',
            'စီးပွားရေး': 'economy',
            'ကျန်းမာရေး': 'health',
            'အားကစား': 'sports',
            'နည်းပညာ': 'technology',
            'ပညာရေး': 'education',
            'ခရီးသွား': 'travel'
        };

        // Enhanced AI Assistant with Weather, News & Calculations
        class AIAssistant {
            extractCity(input) {
                for (const [mmCity, engCity] of Object.entries(myanmarCities)) {
                    if (input.includes(mmCity)) {
                        return { mmCity, engCity };
                    }
                }
                return { mmCity: 'ရန်ကုန်', engCity: 'Yangon' }; // default
            }

            extractNewsCategory(input) {
                for (const [mmCat, engCat] of Object.entries(newsCategories)) {
                    if (input.includes(mmCat)) {
                        return { mmCat, engCat };
                    }
                }
                return { mmCat: 'အထွေထွေ', engCat: 'general' };
            }

            async getRealWeather(input) {
                const { mmCity, engCity } = this.extractCity(input);
                
                try {
                    const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${engCity}&appid=b1b15e88fa797225412429c1c50c122a1&units=metric`);
                    
                    if (!response.ok) {
                        throw new Error('Weather API failed');
                    }
                    
                    const data = await response.json();
                    
                    // Weather translations
                    const weatherTranslations = {
                        'clear sky': '☀️ ကောင်းကင်ပြင့်',
                        'few clouds': '⛅ တိမ်အနည်းငယ်',
                        'scattered clouds': '☁️ တိမ်များပြားနေ',
                        'broken clouds': '☁️ တိမ်ထူထပ်နေ',
                        'overcast clouds': '☁️ တိမ်ဖုံးနေ',
                        'light rain': '🌦️ မိုးအနည်းငယ်',
                        'moderate rain': '🌧️ မိုးအသင့်အတင့်',
                        'heavy intensity rain': '⛈️ မိုးသည်းထန်စွာ',
                        'thunderstorm': '⛈️ မိုးကြိုးပစ်နေ',
                        'mist': '🌫️ မြူထူနေ',
                        'fog': '🌫️ ဆိုင်းနေ',
                        'haze': '🌫️ မြူဆိုင်းနေ'
                    };

                    const mmDesc = weatherTranslations[data.weather[0].description] || data.weather[0].description;

                    return `<strong>🌤️ ${mmCity} မြို့ ရာသီဥတု</strong>
        <div class="weather-result">
        အပူချိန်: <strong>${Math.round(data.main.temp)}°C</strong><br>
        ခံစားရအပူချိန်: <strong>${Math.round(data.main.feels_like)}°C</strong><br>
        ရာသီဥတု: ${mmDesc}<br>
        စိုထိုင်းဆ: ${data.main.humidity}%<br>
        လေတိုက်နှုန်း: ${data.wind.speed} m/s<br>
        လေဖိအား: ${data.main.pressure} hPa<br>
        <small>OpenWeatherMap မှ လက်ရှိဒေတာ</small>
        </div>`;

                } catch (error) {
                    return this.getFallbackWeather(mmCity);
                }
            }

            getFallbackWeather(city) {
                const weatherData = {
                    'ရန်ကုန်': { temp: 32, feels_like: 36, desc: '⛅ တိမ်အနည်းငယ်', humidity: 75, wind: 2.5, pressure: 1010 },
                    'မန္တလေး': { temp: 35, feels_like: 38, desc: '☀️ နေရောင်ခြည်', humidity: 60, wind: 3.0, pressure: 1008 },
                    'နေပြည်တော်': { temp: 33, feels_like: 35, desc: '☁️ တိမ်ထူ', humidity: 70, wind: 2.0, pressure: 1011 },
                    'ပဲခူး': { temp: 31, feels_like: 34, desc: '🌦️ မိုးအနည်းငယ်', humidity: 80, wind: 1.5, pressure: 1012 },
                    'မော်လမြိုင်': { temp: 30, feels_like: 33, desc: '🌧️ မိုးရွာ', humidity: 85, wind: 2.2, pressure: 1010 },
                    'စစ်တွေ': { temp: 29, feels_like: 32, desc: '🌦️ မိုးအနည်းငယ်', humidity: 82, wind: 3.5, pressure: 1009 },
                    'တောင်ကြီး': { temp: 25, feels_like: 27, desc: '⛅ တိမ်အနည်းငယ်', humidity: 78, wind: 1.8, pressure: 1013 }
                };

                const data = weatherData[city] || { temp: 32, feels_like: 36, desc: '⛅ တိမ်အနည်းငယ်', humidity: 75, wind: 2.5, pressure: 1010 };

                return `<strong>🌤️ ${city} မြို့ ရာသီဥတု</strong>
        <div class="weather-result">
        အပူချိန်: <strong>${data.temp}°C</strong><br>
        ခံစားရအပူချိန်: <strong>${data.feels_like}°C</strong><br>
        ရာသီဥတု: ${data.desc}<br>
        စိုထိုင်းဆ: ${data.humidity}%<br>
        လေတိုက်နှုန်း: ${data.wind} m/s<br>
        လေဖိအား: ${data.pressure} hPa<br>
        <small>ခန့်မှန်းခြေဒေတာ</small>
        </div>`;
            }

            async getRealExchange() {
                try {
                    const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                    const data = await response.json();
                    return `<strong>💱 ငွေလဲနှုန်းများ</strong>
        <div class="api-result">
        USD to MMK: <strong>${Math.round(data.rates.MMK).toLocaleString()} ကျပ်</strong><br>
        USD to EUR: ${data.rates.EUR.toFixed(3)}<br>
        USD to SGD: ${data.rates.SGD.toFixed(3)}<br>
        USD to THB: ${data.rates.THB.toFixed(2)}<br>
        USD to CNY: ${data.rates.CNY.toFixed(3)}<br>
        <small>ExchangeRate-API မှ လက်ရှိဒေတာ</small>
        </div>`;
                } catch (error) {
                    return `<strong>💱 ငွေလဲနှုန်းများ</strong>
        <div class="api-result">
        USD to MMK: <strong>2,100 ကျပ်</strong><br>
        USD to EUR: 0.92<br>
        USD to SGD: 1.35<br>
        USD to THB: 35.50<br>
        USD to CNY: 7.25<br>
        <small>ခန့်မှန်းခြေနှုန်းထား</small>
        </div>`;
                }
            }

            async getMyanmarNews(category = '') {
                const { mmCat } = this.extractNewsCategory(category);
                
                try {
                    // Try to fetch from RSS feeds or news API
                    const newsData = await this.fetchNewsFromAPI(mmCat);
                    return this.formatNews(newsData, mmCat);
                } catch (error) {
                    return this.getFallbackNews(mmCat);
                }
            }

            async fetchNewsFromAPI(category) {
                // This is a placeholder for actual news API integration
                // You can integrate with NewsAPI, RSS feeds, or other news sources
                
                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Return sample news data
                return this.getSampleNews(category);
            }

            getSampleNews(category) {
                const sampleNews = {
                    'နိုင်ငံတော်': [
                        { title: 'မြန်မာနိုင်ငံတွင် နည်းပညာဖွံ့ဖြိုးရေး ဆွေးနွေးပွဲ', date: 'ဒီဇင်ဘာ ၁၅, ၂၀၂၄', source: 'MM Times' },
                        
                    ],
                    'စီးပွားရေး': [
                        { title: 'စီးပွားရေးဖွံ့ဖြိုးတိုးတက်မှု ခန့်မှန်းချက်', date: 'ဒီဇင်ဘာ ၁၅, ၂၀၂၄', source: 'Economic Times' },
                        { title: 'နိုင်ငံခြားရင်းနှီးမြှုပ်နှံမှု မြင့်တက်လာ', date: 'ဒီဇင်ဘာ ၁၄, ၂၀၂၄', source: 'Business MM' }
                    ],
                    'ကျန်းမာရေး': [
                        { title: 'ဆေးရုံများတွင် ခေတ်မီကိရိယာများ တပ်ဆင်ရေး', date: 'ဒီဇင်ဘာ ၁၅, ၂၀၂၄', source: 'Health Journal' },
                        { title: 'COVID-19 ကာကွယ်ဆေး ထိုးနှံမှု အစီအစဉ်', date: 'ဒီဇင်ဘာ ၁၄, ၂၀၂၄', source: 'MM Health' }
                    ],
                    'အားကစား': [
                        { title: 'မြန်မာ့ဘောလုံးအသင်း နိုင်ငံတကာပြိုင်ပွဲ', date: 'ဒီဇင်ဘာ ၁၅, ၂၀၂၄', source: 'Sports MM' },
                        { title: 'အားကစားသမားများ နိုင်ငံတကာဆုတံဆိပ်ရရှိ', date: 'ဒီဇင်ဘာ ၁၄, ၂၀၂၄', source: 'Champion News' }
                    ]
                };

                return sampleNews[category] || sampleNews['နိုင်ငံတော်'];
            }

            formatNews(newsItems, category) {
                let newsHTML = `<strong>📰 ${category} သတင်းများ</strong><div class="news-result">`;
                
                newsItems.forEach((news, index) => {
                    newsHTML += `
                        <div class="news-item">
                            <div class="news-title">${index + 1}. ${news.title}</div>
                            <div class="news-date">📅 ${news.date} | 📝 ${news.source}</div>
                        </div>
                    `;
                });
                
                newsHTML += `<small>နမူနာသတင်းများ - အမှန်တကယ်သတင်းများအတွက် သတင်းမီဒီယာများသို့ ကြည့်ရှုပါ</small></div>`;
                return newsHTML;
            }

            getFallbackNews(category) {
                return `<strong>📰 ${category} သတင်းများ</strong>
        <div class="news-result">
            <div class="news-item">
                <div class="news-title">၁. ${category} ဆိုင်ရာ နောက်ဆုံးရသတင်း</div>
                <div class="news-date">📅 ဒီဇင်ဘာ ၁၅, ၂၀၂၄ | 📝 Sample News</div>
            </div>
            <div class="news-item">
                <div class="news-title">၂. ${category} ကဏ္ဍ ဖွံ့ဖြိုးတိုးတက်မှု</div>
                <div class="news-date">📅 ဒီဇင်ဘာ ၁၄, ၂၀၂၄ | 📝 Sample Source</div>
            </div>
            <small>အမှန်တကယ်သတင်းများအတွက် သတင်းမီဒီယာများသို့ ကြည့်ရှုပါ</small>
        </div>`;
            }

            calculate(input) {
                try {
                    // Extract numbers and operators
                    const expression = input.replace(/[^0-9+\-*/().]/g, '');
                    if (expression) {
                        const result = eval(expression);
                        return `<strong>🧮 တွက်ချက်မှုရလဒ်</strong>
        <div class="api-result">
        ${expression} = <strong>${result}</strong><br>
        <small>JavaScript Calculator</small>
        </div>`;
                    }
                    return "🧮 ကျေးဇူးပြု၍ တွက်ချက်မှုတစ်ခုပေးပါ (ဥပမာ: ၁၅×၃)";
                } catch (e) {
                    return "🧮 ကျေးဇူးပြု၍ မှန်ကန်သော တွက်ချက်မှုပေးပါ";
                }
            }

            showWeatherHelp() {
                let citiesHTML = '';
                for (const city of Object.keys(myanmarCities)) {
                    citiesHTML += `<button class="city-btn" data-question="${city} ရာသီဥတု">${city}</button>`;
                }

                return `<strong>🌤️ မြို့အလိုက်ရာသီဥတုများ</strong>
        <div class="api-result">
        <strong>မြို့ရွေးရန်:</strong>
        <div class="city-buttons">
            ${citiesHTML}
        </div>
        <br>
        <strong>ဒါမှမဟုတ် စာရိုက်ပါ:</strong><br>
        • "ရန်ကုန် ရာသီဥတု"<br>
        • "မန္တလေး ရာသီဥတု"<br>
        • "နေပြည်တော် ရာသီဥတု"<br>
        <small>Real API ဖြင့် ချိတ်ဆက်ထားပါသည်</small>
        </div>`;
            }
                 showNewsHelp() {
                let categoriesHTML = '';
                for (const category of Object.keys(newsCategories)) {
                    categoriesHTML += `<button class="news-btn" data-question="${category}သတင်း">${category}</button>`;
                }

                return `<strong>📰 သတင်းအမျိုးအစားများ</strong>
        <div class="api-result">
        <strong>သတင်းအမျိုးအစား ရွေးရန်:</strong>
        <div class="news-buttons">
            ${categoriesHTML}
        </div>
        <br>
        <strong>ဒါမှမဟုတ် စာရိုက်ပါ:</strong><br>
        • "နိုင်ငံတော်သတင်း"<br>
        • "စီးပွားရေးသတင်း"<br>
        • "အားကစားသတင်း"<br>
        <small>နမူနာသတင်းများကို ပြသပေးပါမည်</small>
        </div>`;
            }

            showHelp() {
                return `<strong>🤖 ကျေးဇူးပြု၍ ဒီလိုမေးပါ:</strong>
        <div class="api-result">
        <strong>ရာသီဥတု:</strong><br>
        • "ရာသီဥတု" - မြို့အလိုက်ရာသီဥတုများ<br>
        • "ရန်ကုန် ရာသီဥတု" - တိကျသောမြို့<br><br>

        <strong>သတင်း:</strong><br>
        • "သတင်း" - သတင်းအမျိုးအစားများ<br>
        • "စီးပွားရေးသတင်း" - ကဏ္ဍအလိုက်သတင်း<br><br>

        <strong>အခြား:</strong><br>
        • "ငွေလဲနှုန်း" - လက်ရှိငွေလဲနှုန်းများ<br>
        • "၁၅×၃ တွက်ပေးပါ" - တွက်ချက်မှုလုပ်ဆောင်ချက်<br>
        <small>Real APIs များဖြင့် ချိတ်ဆက်ထားပါသည်</small>
        </div>`;
            }

            async process(input) {
                if (input.includes('ရာသီဥတု')) {
                    if (input === 'ရာသီဥတု') {
                        return this.showWeatherHelp();
                    }
                    return await this.getRealWeather(input);
                } else if (input.includes('သတင်း')) {
                    if (input === 'သတင်း') {
                        return this.showNewsHelp();
                    }
                    return await this.getMyanmarNews(input);
                } else if (input.includes('ငွေလဲ')) {
                    return await this.getRealExchange();
                } else if (input.includes('တွက်') || input.includes('+') || input.includes('-') || input.includes('*') || input.includes('/')) {
                    return this.calculate(input);
                } else {
                    return this.showHelp();
                }
            }
        }

        // Chat Application
        const ai = new AIAssistant();
        const messages = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Fixed button click handler
        function askQuestion(question) {
            userInput.value = question;
            sendMessage();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';
            showTyping();

            try {
                const response = await ai.process(message);
                hideTyping();
                addMessage(response, 'bot');
            } catch (error) {
                hideTyping();
                addMessage("တောင်းပန်ပါတယ်၊ အမှားတစ်ခုဖြစ်သွားပါတယ်။", 'bot');
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = text;
            
            messageDiv.appendChild(bubble);
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
            
            // Re-attach event listeners to new buttons
            attachButtonListeners();
        }

        function showTyping() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            messageDiv.id = 'typingIndicator';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble typing';
            bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            messageDiv.appendChild(bubble);
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function hideTyping() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Fixed button event listener attachment
        function attachButtonListeners() {
            // Remove existing event listeners first
            document.querySelectorAll('.quick-btn, .city-btn, .news-btn').forEach(btn => {
                btn.replaceWith(btn.cloneNode(true));
            });

            // Add new event listeners
            document.querySelectorAll('.quick-btn, .city-btn, .news-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const question = this.getAttribute('data-question');
                    if (question) {
                        askQuestion(question);
                    }
                });
            });
        }

        // Initialize event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Attach button listeners on page load
        document.addEventListener('DOMContentLoaded', function() {
            attachButtonListeners();
            userInput.focus();
        });

        // Auto-focus on input
        userInput.focus();

        console.log('🚀 Myanmar AI Assistant with Weather & News loaded!');
    </script>
</body>
</html>
