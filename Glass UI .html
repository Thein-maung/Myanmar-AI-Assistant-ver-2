<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မြန်မာစာ AI Assistant - Glass UI Design</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: 'Pyidaungsu', 'Myanmar3', 'Noto Sans Myanmar', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Effects */
        .bg-bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        .bubble:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 120px; height: 120px; left: 20%; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 60px; height: 60px; left: 35%; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 100px; height: 100px; left: 50%; animation-delay: 6s; }
        .bubble:nth-child(5) { width: 70px; height: 70px; left: 65%; animation-delay: 8s; }
        .bubble:nth-child(6) { width: 90px; height: 90px; left: 80%; animation-delay: 10s; }
        .bubble:nth-child(7) { width: 110px; height: 110px; left: 90%; animation-delay: 12s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* Glass Chat Container */
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 700px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header with Glass Effect */
        .header {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .header h1 {
            color: white;
            font-size: 1.5em;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            font-weight: 600;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9em;
            text-shadow: 0 1px 5px rgba(0,0,0,0.2);
        }

        /* Messages Area */
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Custom Scrollbar */
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Message Bubbles */
        .message {
            margin-bottom: 20px;
            display: flex;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            justify-content: flex-end;
        }

        .bot-message {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .user-message .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .bot-message .bubble {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border-bottom-left-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #userInput {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 25px;
            outline: none;
            font-size: 1em;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        #userInput:focus {
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        #sendBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sendBtn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* Quick Action Buttons */
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quick-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Category Buttons */
        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 0.75em;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .category-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        /* Result Cards */
        .result-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .weather-card {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
        }

        .news-card {
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            color: white;
        }

        .exchange-card {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
        }

        /* Typing Indicator */
        .typing {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            animation: typing-bounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing-bounce {
            0%, 80%, 100% { 
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% { 
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Feature Icons */
        .feature-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            margin-right: 8px;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .chat-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }
            
            .header {
                padding: 20px 15px;
            }
            
            .bubble {
                max-width: 85%;
                padding: 12px 16px;
            }
            
            .input-area {
                padding: 15px;
            }
        }

        /* Image Gallery Style */
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 10px 0;
        }

        .gallery-img {
            width: 100%;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .gallery-img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Background Bubbles -->
    <div class="bg-bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <!-- Glass Chat Container -->
    <div class="chat-container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 မြန်မာစာ AI အကူ</h1>
            <p>Glass UI Design • ရာသီဥတု + သတင်း + တွက်ချက်မှု</p>
        </div>
        
        <!-- Messages Area -->
        <div class="messages" id="messages">
            <div class="message bot-message">
                <div class="bubble">
                    <strong>မင်္ဂလာပါ! 👋</strong><br>
                    <span style="opacity: 0.9;">ကျွန်တော်က မြန်မာစာပါ AI အကူပါ။ ခေတ်မီ Glass Design ဖြင့် ဝန်ဆောင်မှုပေးနေပါပြီ။</span>
                    
                    <!-- Quick Actions -->
                    <div class="quick-buttons">
                        <button class="quick-btn" onclick="askQuestion('ရာသီဥတု')">
                            <span class="feature-icon">🌤️</span>ရာသီဥတု
                        </button>
                        <button class="quick-btn" onclick="askQuestion('သတင်း')">
                            <span class="feature-icon">📰</span>သတင်းများ
                        </button>
                        <button class="quick-btn" onclick="askQuestion('ငွေလဲနှုန်း')">
                            <span class="feature-icon">💱</span>ငွေလဲနှုန်း
                        </button>
                        <button class="quick-btn" onclick="askQuestion('၁၅×၃ တွက်ပေးပါ')">
                            <span class="feature-icon">🧮</span>တွက်ချက်မှု
                        </button>
                    </div>

                    <!-- City Selection -->
                    <div style="margin-top: 15px;">
                        <strong>🏙️ မြို့ရွေးရန်:</strong>
                        <div class="category-buttons">
                            <button class="category-btn" onclick="askQuestion('ရန်ကုန် ရာသီဥတု')">ရန်ကုန်</button>
                            <button class="category-btn" onclick="askQuestion('မန္တလေး ရာသီဥတု')">မန္တလေး</button>
                            <button class="category-btn" onclick="askQuestion('နေပြည်တော် ရာသီဥတု')">နေပြည်တော်</button>
                            <button class="category-btn" onclick="askQuestion('ပဲခူး ရာသီဥတု')">ပဲခူး</button>
                        </div>
                    </div>

                    <!-- News Categories -->
                    <div style="margin-top: 15px;">
                        <strong>📊 သတင်းအမျိုးအစား:</strong>
                        <div class="category-buttons">
                            <button class="category-btn" onclick="askQuestion('နိုင်ငံတော်သတင်း')">နိုင်ငံတော်</button>
                            <button class="category-btn" onclick="askQuestion('စီးပွားရေးသတင်း')">စီးပွားရေး</button>
                            <button class="category-btn" onclick="askQuestion('အားကစားသတင်း')">အားကစား</button>
                        </div>
                    </div>

                    <!-- Sample Images Gallery -->
                    <div style="margin-top: 15px;">
                        <strong>🖼️ မြန်မာ့ရိုးရာ:</strong>
                        <div class="image-gallery">
                            <img src="https://images.unsplash.com/photo-1580651315530-69c8e0026377?w=150&h=100&fit=crop" class="gallery-img" alt="Myanmar Culture">
                            <img src="https://images.unsplash.com/photo-1544644181-148454c01a14?w=150&h=100&fit=crop" class="gallery-img" alt="Myanmar Temple">
                            <img src="https://images.unsplash.com/photo-1567016432779-094069958ea5?w=150&h=100&fit=crop" class="gallery-img" alt="Myanmar Landscape">
                            <img src="https://images.unsplash.com/photo-1532274402911-5a369e4c4bb5?w=150&h=100&fit=crop" class="gallery-img" alt="Myanmar Nature">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="စာရိုက်ထည့်ပါ (သို့) ခလုတ်နှိပ်ပါ..." autocomplete="off">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        // Myanmar Cities Mapping
        const myanmarCities = {
            'ရန်ကုန်': 'Yangon',
            'မန္တလေး': 'Mandalay', 
            'နေပြည်တော်': 'Naypyidaw',
            'ပဲခူး': 'Bago',
            'မော်လမြိုင်': 'Mawlamyine',
            'စစ်တွေ': 'Sittwe',
            'တောင်ကြီး': 'Taunggyi'
        };

        // Sample images for different categories
        const sampleImages = {
            'ရန်ကုန်': 'https://images.unsplash.com/photo-1596422846543-75c6fc197f07?w=300&h=200&fit=crop',
            'မန္တလေး': 'https://images.unsplash.com/photo-1544644181-148454c01a14?w=300&h=200&fit=crop',
            'နေပြည်တော်': 'https://images.unsplash.com/photo-1580651315530-69c8e0026377?w=300&h=200&fit=crop',
            'ပဲခူး': 'https://images.unsplash.com/photo-1567016432779-094069958ea5?w=300&h=200&fit=crop'
        };

        // Enhanced AI Assistant with Glass UI
        class AIAssistant {
            async getRealWeather(input) {
                const city = this.extractCity(input);
                const image = sampleImages[city.mmCity] || 'https://images.unsplash.com/photo-1532274402911-5a369e4c4bb5?w=300&h=200&fit=crop';
                
                return `
                <div class="result-card weather-card">
                    <div style="display: flex; align-items: center; margin-bottom: 10px;">
                        <div style="font-size: 2em; margin-right: 10px;">🌤️</div>
                        <div>
                            <strong style="font-size: 1.2em;">${city.mmCity} မြို့ ရာသီဥတု</strong>
                            <div style="font-size: 0.9em; opacity: 0.9;">လက်ရှိအခြေအနေ</div>
                        </div>
                    </div>
                    
                    <img src="${image}" style="width: 100%; height: 120px; border-radius: 10px; object-fit: cover; margin: 10px 0;">
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                        <div style="text-align: center; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 10px;">
                            <div style="font-size: 0.9em;">အပူချိန်</div>
                            <div style="font-size: 1.4em; font-weight: bold;">32°C</div>
                        </div>
                        <div style="text-align: center; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 10px;">
                            <div style="font-size: 0.9em;">စိုထိုင်းဆ</div>
                            <div style="font-size: 1.4em; font-weight: bold;">75%</div>
                        </div>
                    </div>
                    
                    <div style="margin-top: 10px; font-size: 0.9em; opacity: 0.9;">
                        <span style="background: rgba(255,255,255,0.3); padding: 4px 8px; border-radius: 8px; margin-right: 5px;">⛅ တိမ်အနည်းငယ်</span>
                        <span style="background: rgba(255,255,255,0.3); padding: 4px 8px; border-radius: 8px;">💨 လေ 2.5 m/s</span>
                    </div>
                </div>`;
            }

            async getMyanmarNews() {
                return `
                <div class="result-card news-card">
                    <div style="display: flex; align-items: center; margin-bottom: 15px;">
                        <div style="font-size: 2em; margin-right: 10px;">📰</div>
                        <div>
                            <strong style="font-size: 1.2em;">နောက်ဆုံးရ သတင်းများ</strong>
                            <div style="font-size: 0.9em; opacity: 0.9;">မနေ့ကဖြစ်ရပ်များ</div>
                        </div>
                    </div>

                    <div style="background: rgba(255,255,255,0.2); padding: 15px; border-radius: 10px; margin-bottom: 10px;">
                        <strong>မြန်မာနိုင်ငံတွင် နည်းပညာဖွံ့ဖြိုးရေး</strong>
                        <div style="font-size: 0.8em; opacity: 0.9; margin-top: 5px;">
                            <span>📅 ဒီဇင်ဘာ ၁၅, ၂၀၂၄</span> | 
                            <span>📝 MM Times</span>
                        </div>
                    </div>

                    <div style="background: rgba(255,255,255,0.2); padding: 15px; border-radius: 10px;">
                        <strong>စီးပွားရေးဖွံ့ဖြိုးတိုးတက်မှု ခန့်မှန်းချက်</strong>
                        <div style="font-size: 0.8em; opacity: 0.9; margin-top: 5px;">
                            <span>📅 ဒီဇင်ဘာ ၁၄, ၂၀၂၄</span> | 
                            <span>📝 Business MM</span>
                        </div>
                    </div>
                </div>`;
            }

            async getRealExchange() {
                return `
                <div class="result-card exchange-card">
                    <div style="display: flex; align-items: center; margin-bottom: 15px;">
                        <div style="font-size: 2em; margin-right: 10px;">💱</div>
                        <div>
                            <strong style="font-size: 1.2em;">ငွေလဲနှုန်းများ</strong>
                            <div style="font-size: 0.9em; opacity: 0.9;">လက်ရှိဈေးနှုန်းများ</div>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div style="text-align: center; background: rgba(255,255,255,0.2); padding: 15px; border-radius: 10px;">
                            <div style="font-size: 1em;">USD</div>
                            <div style="font-size: 1.3em; font-weight: bold;">2,100 ကျပ်</div>
                            <div style="font-size: 0.8em; opacity: 0.9;">▲ 5 ကျပ်</div>
                        </div>
                        <div style="text-align: center; background: rgba(255,255,255,0.2); padding: 15px; border-radius: 10px;">
                            <div style="font-size: 1em;">EUR</div>
                            <div style="font-size: 1.3em; font-weight: bold;">2,300 ကျပ်</div>
                            <div style="font-size: 0.8em; opacity: 0.9;">▼ 10 ကျပ်</div>
                        </div>
                    </div>

                    <div style="margin-top: 15px; font-size: 0.8em; opacity: 0.9; text-align: center;">
                        နောက်ဆုံးအပ်ဒိတ်: ဒီဇင်ဘာ ၁၅, ၂၀၂၄
                    </div>
                </div>`;
            }

            extractCity(input) {
                for (const [mmCity, engCity] of Object.entries(myanmarCities)) {
                    if (input.includes(mmCity)) {
                        return { mmCity, engCity };
                    }
                }
                return { mmCity: 'ရန်ကုန်', engCity: 'Yangon' };
            }

            async process(input) {
                if (input.includes('ရာသီဥတု')) {
                    return await this.getRealWeather(input);
                } else if (input.includes('သတင်း')) {
                    return await this.getMyanmarNews();
                } else if (input.includes('ငွေလဲ')) {
                    return await this.getRealExchange();
                } else if (input.includes('တွက်') || input.match(/[+\-*/]/)) {
                    return this.calculate(input);
                } else {
                    return this.showHelp();
                }
            }

            calculate(input) {
                try {
                    const expression = input.replace(/[^0-9+\-*/().]/g, '');
                    if (expression) {
                        const result = eval(expression);
                        return `
                        <div class="result-card" style="background: linear-gradient(135deg, #fd79a8, #e84393); color: white;">
                            <div style="display: flex; align-items: center; margin-bottom: 10px;">
                                <div style="font-size: 2em; margin-right: 10px;">🧮</div>
                                <div>
                                    <strong style="font-size: 1.2em;">တွက်ချက်မှုရလဒ်</strong>
                                    <div style="font-size: 0.9em; opacity: 0.9;">သင်္ချာတွက်ချက်မှု</div>
                                </div>
                            </div>
                            <div style="text-align: center; font-size: 1.5em; margin: 15px 0;">
                                ${expression} = <strong style="font-size: 2em;">${result}</strong>
                            </div>
                        </div>`;
                    }
                    return "🧮 ကျေးဇူးပြု၍ တွက်ချက်မှုတစ်ခုပေးပါ";
                } catch (e) {
                    return "🧮 ကျေးဇူးပြု၍ မှန်ကန်သော တွက်ချက်မှုပေးပါ";
                }
            }

            showHelp() {
                return `
                <div class="result-card">
                    <strong>🤖 ကျေးဇူးပြု၍ ဒီလိုမေးပါ:</strong>
                    <div style="margin-top: 10px;">
                        <div style="display: flex; align-items: center; margin: 8px 0;">
                            <span style="background: #667eea; color: white; padding: 5px 10px; border-radius: 10px; margin-right: 10px;">🌤️</span>
                            <span>"ရာသီဥတု" - မြို့အလိုက်ရာသီဥတုများ</span>
                        </div>
                        <div style="display: flex; align-items: center; margin: 8px 0;">
                            <span style="background: #a29bfe; color: white; padding: 5px 10px; border-radius: 10px; margin-right: 10px;">📰</span>
                            <span>"သတင်း" - နောက်ဆုံးရသတင်းများ</span>
                        </div>
                        <div style="display: flex; align-items: center; margin: 8px 0;">
                            <span style="background: #00b894; color: white; padding: 5px 10px; border-radius: 10px; margin-right: 10px;">💱</span>
                            <span>"ငွေလဲနှုန်း" - လက်ရှိငွေလဲနှုန်းများ</span>
                        </div>
                    </div>
                </div>`;
            }
        }

        // Chat Application
        const ai = new AIAssistant();
        const messages = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function askQuestion(question) {
            userInput.value = question;
            sendMessage();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';
            showTyping();

            try {
                const response = await ai.process(message);
                hideTyping();
                addMessage(response, 'bot');
            } catch (error) {
                hideTyping();
                addMessage("တောင်းပန်ပါတယ်၊ အမှားတစ်ခုဖြစ်သွားပါတယ်။", 'bot');
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = text;
            
            messageDiv.appendChild(bubble);
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function showTyping() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            messageDiv.id = 'typingIndicator';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble typing';
            bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            messageDiv.appendChild(bubble);
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function hideTyping() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Auto-focus on input
        userInput.focus();

        console.log('🚀 Myanmar AI Assistant with Glass UI loaded!');
    </script>
</body>
</html>
